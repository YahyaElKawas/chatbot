<!doctype html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body {
        font-family: Arial;
        margin-top: 0px;
        margin-bottom: 0px;
      }

      .send-button {
        background-color: rgb(25, 135, 84);
        color: white;
        padding: 12px 20px;
        margin-left: 10px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
      }

      .chat-input {
        padding: 12px 15px;
        border-radius: 10px;
        border-width: 1px;
        font-size: 15px;
        flex-grow: 1;
      }

      .app-container {
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
      }

      .chat-message-robot {
        display: flex;
        align-items: start;
      }

      .chat-message-text {
        background-color: rgb(238, 238, 238);
        padding: 15px 20px;
        border-radius: 10px;
        margin-right: 10px;
        margin-left: 10px;
        margin-bottom: 20px;
        max-width: 300px;
      }

      .chat-message-photo {
        width: 45px;
      }

      .chat-messages-container {
        flex-grow: 1; /*Will position chat input at the bottom and use the remaining space of the div*/
        margin-top: 20px;
        overflow: scroll;
        scrollbar-width: none;
      }

      .chat-input-container {
        display: flex;
        margin-bottom: 60px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/chatbot.js">
      // This is an external library that's responsible for getting the response
      // of the chatbot, it's an object with keys (user input) and values (chatbot response)
    </script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script type="text/babel">
      // props is an object that contains all of the attributes
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState("");

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        function sendMessage() {
          const newChatMessages = [
            ...chatMessages,
            {
              message: inputText,
              sender: "user",
              id: crypto.randomUUID(),
            },
          ];

          setChatMessages(newChatMessages);

          const response = Chatbot.getResponse(inputText);
          setChatMessages([
            ...newChatMessages,
            {
              message: response,
              sender: "robot",
              id: crypto.randomUUID(),
            },
          ]);

          setInputText("");
        }

        return (
          <div className="chat-input-container">
            <input
              placeholder="Send a message to Chatbot"
              size="30"
              onChange={saveInputText}
              value={inputText}
              class="chat-input"
            />
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        return (
          <div
            className={
              sender === "user" ? "chat-message-user" : "chat-message-robot"
            }
          >
            {sender === "robot" && (
              <img src="robot.png" className="chat-message-photo" />
            )}
            <div className="chat-message-text">{message}</div>
            {sender === "user" && (
              <img src="user.png" className="chat-message-photo" />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages }) {
        // React state that is connected to the HTML, when we update it the HTML will be updated

        //const [chatMessages, setChatMessages] = array;
        //const chatMessages = array[0]; // In react we shouldn't update the data instantly we should copy it first and then update it
        //const setChatMessages = array[1]; // Updater function
        const chatMessagesRef = React.useRef(null); //In react we shouldn't use dom to access html elements
        // To access html elements stored in react ref we have to go to useEffect
        React.useEffect(() => {
          const containerElement = chatMessagesRef.current;
          if (containerElement) {
            containerElement.scrollTop = containerElement.scrollHeight;
          }
        }, [chatMessages]); // Dependency array: The thing that will change
        return (
          <div className="chat-messages-container" ref={chatMessagesRef}>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          { message: "Hello chatbot", sender: "user", id: "id1" },
          { message: "Hello how can I help you?", sender: "robot", id: "id2" },
          {
            message: "Can you get me today's date?",
            sender: "user",
            id: "id3",
          },
          { message: "Today is september 27", sender: "robot", id: "id4" },
        ]);

        return (
          <div className="app-container">
            <ChatMessages chatMessages={chatMessages}></ChatMessages>
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            ></ChatInput>
          </div>
        );
      }

      // Any component in react has to begin with capital letter

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
